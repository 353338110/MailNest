name: mailnest_app
description: A local-first, privacy-focused multi-account email client built with Flutter.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0-233.0.dev

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  cryptography: ^2.9.0
  drift: ^2.34.2
  file_picker: ^12.0.0-beta.5
  drift_flutter: ^0.3.0
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.0.0-beta.4
  go_router: ^17.0.0
  http: ^1.6.0
  intl: any
  path: ^1.9.1
  path_provider: ^2.1.6
  crypto: ^3.0.7
  url_launcher: ^6.3.2
  app_links: ^7.0.0
  open_filex: ^4.5.0

dev_dependencies:
  build_runner: ^2.10.4
  drift_dev: ^2.29.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
