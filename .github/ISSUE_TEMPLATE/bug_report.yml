name: Bug report
description: Report a reproducible problem.
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Android, iOS, Windows, macOS, or Linux
    validations:
      required: true
