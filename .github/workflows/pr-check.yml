name: PR Check

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  flutter-check:
    name: Flutter Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: bash .github/scripts/check-generated-code.sh

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
