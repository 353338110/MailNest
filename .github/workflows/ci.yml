name: CI

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      build_linux:
        description: Run Linux desktop build
        type: boolean
        default: true
      build_android:
        description: Run Android APK build
        type: boolean
        default: true
      build_windows:
        description: Run Windows desktop build
        type: boolean
        default: true
      build_macos:
        description: Run macOS desktop build
        type: boolean
        default: true
      build_ios:
        description: Run iOS no-codesign build
        type: boolean
        default: true

jobs:
  flutter-check:
    name: Flutter Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: bash .github/scripts/check-generated-code.sh

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  linux-build:
    name: Linux Build
    runs-on: ubuntu-latest
    needs: flutter-check
    if: github.event_name != 'workflow_dispatch' || inputs.build_linux

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev libsecret-1-dev ninja-build pkg-config

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: bash .github/scripts/check-generated-code.sh

      - name: Build Linux
        run: flutter build linux --debug

  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    needs: flutter-check
    if: github.event_name != 'workflow_dispatch' || inputs.build_android

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: bash .github/scripts/check-generated-code.sh

      - name: Build Android APK
        run: flutter build apk --debug

  windows-build:
    name: Windows Build
    runs-on: windows-latest
    needs: flutter-check
    if: github.event_name != 'workflow_dispatch' || inputs.build_windows

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: bash .github/scripts/check-generated-code.sh

      - name: Build Windows
        run: flutter build windows --debug

  macos-build:
    name: macOS Build
    runs-on: macos-latest
    needs: flutter-check
    if: github.event_name != 'workflow_dispatch' || inputs.build_macos

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: bash .github/scripts/check-generated-code.sh

      - name: Build macOS
        run: flutter build macos --debug

  ios-build:
    name: iOS Build
    runs-on: macos-latest
    needs: flutter-check
    if: github.event_name != 'workflow_dispatch' || inputs.build_ios

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: bash .github/scripts/check-generated-code.sh

      - name: Build iOS
        run: flutter build ios --debug --no-codesign
